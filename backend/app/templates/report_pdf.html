<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page {
    size: A4;
    margin: 0;
  }

  body {
    font-family: "SimSun", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 11pt;
    line-height: 1.8;
    color: #333;
  }

  h1 {
    font-size: 18pt;
    font-weight: bold;
    text-align: center;
    margin: 1.5em 0 1em 0;
    page-break-before: avoid;
  }

  h2 {
    font-size: 14pt;
    font-weight: bold;
    margin: 1.2em 0 0.6em 0;
    padding-bottom: 0.3em;
    border-bottom: 1px solid #ddd;
    page-break-after: avoid;
  }

  h3 {
    font-size: 12pt;
    font-weight: bold;
    margin: 1em 0 0.5em 0;
    page-break-after: avoid;
  }

  h4, h5, h6 {
    font-size: 11pt;
    font-weight: bold;
    margin: 0.8em 0 0.4em 0;
  }

  p {
    margin: 0.5em 0;
    text-indent: 2em;
  }

  ul, ol {
    margin: 0.5em 0;
    padding-left: 2em;
  }

  li {
    margin: 0.3em 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
    font-size: 10pt;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }

  th {
    background-color: #f5f5f5;
    font-weight: bold;
  }

  blockquote {
    margin: 0.8em 0;
    padding: 0.5em 1em;
    border-left: 3px solid #ccc;
    background-color: #f9f9f9;
    color: #555;
  }

  code {
    font-family: "Courier New", monospace;
    font-size: 9pt;
    background-color: #f0f0f0;
    padding: 1px 4px;
    border-radius: 2px;
  }

  pre {
    background-color: #f5f5f5;
    border: 1px solid #ddd;
    padding: 10px;
    font-size: 9pt;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  pre code {
    background: none;
    padding: 0;
  }

  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 1.5em 0;
  }

  strong {
    font-weight: bold;
  }

  em {
    font-style: italic;
  }

  a {
    color: #1a73e8;
    text-decoration: underline;
  }

  /* 强制中文标点后的段落 */
  .content {
    max-width: 100%;
  }
</style>
</head>
<body>
<div class="content">
{{ content }}
</div>
</body>
</html>
