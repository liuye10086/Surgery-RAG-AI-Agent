<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page {
    size: A4;
    margin: 0;
  }

  /* ===== 基础排版 ===== */
  body {
    font-family: "Microsoft YaHei", "SimSun", "PingFang SC", sans-serif;
    font-size: 10.5pt;
    line-height: 1.8;
    color: #333;
  }

  h1 {
    font-size: 17pt;
    font-weight: bold;
    text-align: center;
    margin: 1.2em 0 0.8em 0;
    page-break-before: avoid;
  }

  h2 {
    font-size: 13pt;
    font-weight: bold;
    margin: 1.5em 0 0.6em 0;
    padding-bottom: 0.3em;
    border-bottom: 1.5px solid #3a7ca5;
    color: #2c5f7e;
    page-break-after: avoid;
  }

  h3 {
    font-size: 11.5pt;
    font-weight: bold;
    margin: 1.2em 0 0.5em 0;
    page-break-after: avoid;
  }

  h4, h5, h6 {
    font-size: 10.5pt;
    font-weight: bold;
    margin: 0.8em 0 0.4em 0;
  }

  p {
    margin: 0.5em 0;
  }

  /* 列表 */
  ul, ol {
    margin: 0.5em 0;
    padding-left: 2em;
  }

  li {
    margin: 0.3em 0;
  }

  /* ===== 表格 ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
    font-size: 9.5pt;
    page-break-inside: avoid;
  }

  th, td {
    border: 1px solid #bbb;
    padding: 5px 8px;
    text-align: left;
    vertical-align: top;
  }

  th {
    background-color: #e8eef3;
    font-weight: bold;
    color: #2c5f7e;
  }

  tr:nth-child(even) td {
    background-color: #f9fafb;
  }

  /* ===== 引用块 ===== */
  blockquote {
    margin: 0.8em 0;
    padding: 0.6em 1em;
    border-left: 3px solid #c9986a;
    background-color: #fdf8f3;
    color: #6b5a4b;
  }

  .warning, .model-status {
    padding: 0.6em 0.9em;
    border-left: 3px solid #c9986a;
    background: #fdf8f3;
    color: #6b5a4b;
  }

  .provenance {
    color: #6b5a4b;
    font-size: 9pt;
  }

  /* ===== 代码 ===== */
  code {
    font-family: "Courier New", "Consolas", monospace;
    font-size: 9pt;
    background-color: #f0f0f0;
    padding: 1px 5px;
    border-radius: 3px;
    color: #333;
  }

  pre {
    background-color: #f5f5f5;
    border: 1px solid #ddd;
    padding: 10px 14px;
    font-size: 9pt;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    page-break-inside: avoid;
  }

  pre code {
    background: none;
    padding: 0;
  }

  /* ===== 其他 ===== */
  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 1.2em 0;
  }

  strong {
    font-weight: bold;
    color: #222;
  }

  em {
    font-style: italic;
  }

  a {
    color: #2c5f7e;
    text-decoration: underline;
  }

  /* 内容容器 */
  .content {
    max-width: 100%;
  }

  /* 引用标记 [1] [2] 等 */
  .content sup {
    font-size: 0.85em;
    color: #3a7ca5;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="content">
{{ content | safe }}
</div>
</body>
</html>
